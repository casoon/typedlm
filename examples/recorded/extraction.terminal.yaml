# Plays the recorded run in extraction.txt (see README.md in this folder).
version: 1
terminal:
  title: cargo run --example extraction
  cols: 64
  rows: 8
  theme: catppuccin-mocha
steps:
  - run: export TYPEDLM_MODEL=qwen3:32b
  - run: cargo run --example extraction
  - wait: 1200
  - show: extraction.txt
    lang: text
  - wait: 3000
