[package]
name = "typedlm"
description = "Typed, testable LLM programs for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["derive", "http", "eval"]
derive = ["dep:typedlm-macros"]
eval = ["dep:futures-util"]
optimize = ["eval", "dep:pathwise"]
http = ["dep:reqwest", "dep:tokio"]

[dependencies]
typedlm-macros = { path = "../typedlm-macros", version = "0.0.0", optional = true }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Until pathwise publishes budgeted_local_search (casoon/pathwise#2).
pathwise = { git = "https://github.com/casoon/pathwise", rev = "c625574861a3979807cea1c8d03e6e94b82f1e70", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[[example]]
name = "classification"
required-features = ["derive", "http"]

[[example]]
name = "extraction"
required-features = ["derive", "http"]

[[example]]
name = "evaluation"
required-features = ["derive", "http", "eval"]
